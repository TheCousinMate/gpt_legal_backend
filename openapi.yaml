openapi: 3.1.0
info:
  title: Forensic Legal Cognition 4.1
  description: API chilena de análisis jurídico automatizado, evaluación doctrinal y verificación forense de alta precisión.
  version: 4.1.0
  contact:
    name: Kabir K. Hazbún Crovetto
    email: khazbun@gmail.com
    url: https://github.com/TheCousinMate/gpt_legal_backend
  license:
    name: SafeCreative
    url: https://www.safecreative.org/work/2405266632445
servers:
  - url: https://gpt-legal-backend.onrender.com
paths:
  /reflexion:
    post:
      summary: Reflexionar
      description: Analiza jurídicamente un texto en lenguaje natural.
      operationId: reflexionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextoEntrada'
      responses:
        '200':
          description: Resultado del análisis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultado'

  /predict:
    post:
      summary: Predicción
      description: Realiza una predicción basada en datos legales o fácticos.
      operationId: predecir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextoEntrada'
      responses:
        '200':
          description: Resultado de la predicción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultado'

  /vision:
    post:
      summary: Análisis de Imagen Forense
      description: Extrae y analiza texto desde una imagen subida.
      operationId: analizarImagen
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
              required:
                - file
      responses:
        '200':
          description: Texto extraído de la imagen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultado'

  /legislacion:
    post:
      summary: Consulta Legislación Chilena
      description: Busca normas en la base de datos del Congreso Nacional.
      operationId: consultarLegislacion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextoEntrada'
      responses:
        '200':
          description: Normas legales encontradas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultado'

  /forensics:
    post:
      summary: Análisis Forense de Datos
      description: Evalúa e interpreta contenido de entrada con enfoque forense.
      operationId: analizarForense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextoEntrada'
      responses:
        '200':
          description: Resultado del análisis forense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultado'

  /bcn:
    post:
      summary: Parser BCN
      description: Analiza o extrae estructura semántica desde documentos legales del sitio del Congreso.
      operationId: analizarBCN
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextoEntrada'
      responses:
        '200':
          description: Resultado de la extracción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultado'

  /interpretar:
    post:
      summary: Interpretación del mensaje
      description: Procesa y devuelve una interpretación del mensaje de entrada.
      operationId: interpretar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextoEntrada'
      responses:
        '200':
          description: Respuesta interpretada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Resultado'

components:
  schemas:
    TextoEntrada:
      type: object
      properties:
        texto:
          type: string
          example: ¿Cuál es el enfoque más sólido según la doctrina civil chilena?
      required:
        - texto
    Resultado:
      type: object
      properties:
        resultado:
          type: string
          example: Según la doctrina predominante...