openapi: 3.1.0
info:
  title: Forensic Legal Cognition 4.1
  description: API chilena de análisis jurídico automatizado, evaluación doctrinal y verificación forense de alta precisión.
  version: "4.1.0"
  contact:
    name: Kabir K. Hazbún Crovetto
    email: khazbun@gmail.com
    url: https://github.com/TheCousinMate/gpt_legal_backend
  license:
    name: SafeCreative
    url: https://www.safecreative.org/work/2405266632445
servers:
  - url: https://gpt-legal-backend.onrender.com
paths:
  /reflexion:
    post:
      summary: Reflexionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mensaje:
                  type: string
      responses:
        '200':
          description: Resultado reflexivo

  /predict:
    post:
      summary: Predecir
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                entrada:
                  type: string
      responses:
        '200':
          description: Predicción generada

  /vision:
    post:
      summary: Análisis de imagen forense (OCR)
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Resultado OCR

  /interpretar:
    post:
      summary: Interpretación conversacional de texto legal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                mensaje:
                  type: string
      responses:
        '200':
          description: Resultado interpretado

  /bcn:
    get:
      summary: Consulta de artículos jurídicos estructurados desde BCN
      responses:
        '200':
          description: Artículos y normas obtenidas

  /leyes:
    get:
      summary: Listado o corpus legal aplicado
      responses:
        '200':
          description: Corpus legislativo completo

  /proxy:
    post:
      summary: Proxy legal o analizador externo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                input:
                  type: string
      responses:
        '200':
          description: Resultado del análisis

  /status/json:
    get:
      summary: Estado del backend y total de endpoints
      responses:
        '200':
          description: Información de estado del servicio
