openapi: 3.1.0
info:
  title: Forensic Legal Cognition 4.1
  version: "4.1.0"
  description: >
    API privada de análisis jurídico chileno, con capacidad predictiva doctrinal,
    evaluación forense y criterios de compatibilidad normativa. Uso reservado.
  contact:
    name: Kabir K. Hazbún Crovetto
    email: khazbun@gmail.com
    url: https://github.com/TheCousinMate/gpt_legal_backend
  license:
    name: Licencia Comercial Privada
    url: https://www.safecreative.org

servers:
  - url: http://localhost:8000
    description: Entorno de prueba local (privado)

paths:
  /:
    get:
      summary: Estado del sistema
      operationId: estadoRaiz
      responses:
        '200':
          description: Sistema operativo

  /status/json:
    get:
      summary: Diagnóstico del sistema
      operationId: estadoAvanzado
      responses:
        '200':
          description: Diagnóstico completo del backend
