openapi: 3.1.0
info:
  title: Forensic Legal Cognition 4.1
  description: API chilena de análisis jurídico automatizado, evaluación doctrinal y verificación forense de alta precisión.
  version: "4.1.0"
  contact:
    name: Kabir K. Hazbún Crovetto
    url: https://github.com/TheCousinMate/gpt_legal_backend
    email: khazbun@gmail.com
  license:
    name: SafeCreative
    url: https://www.safecreative.org/work/2405266632445
servers:
  - url: https://gpt-legal-backend.onrender.com
paths:
  /reflexion:
    post:
      summary: "Reflexionar"
      operationId: reflexionar
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                texto:
                  type: string
                  example: "¿Cuál es el principio rector en esta jurisprudencia?"
      responses:
        '200':
          description: Respuesta del modelo Forensic Legal Cognition 4.1
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultado:
                    type: string