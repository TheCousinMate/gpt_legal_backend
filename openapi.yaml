openapi: 3.0.3
info:
  title: GPT Legal Backend API
  version: 1.0.0
  description: API jurídica avanzada para análisis predictivo, forense, doctrinal y legal.
servers:
  - url: https://gpt-legal-backend.onrender.com
    description: Producción Render
  - url: http://localhost:8000
    description: Desarrollo local

paths:
  /predict:
    post:
      operationId: predecirRiesgoLegal
      summary: Predicción de riesgo legal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrediccionInput'
      responses:
        '200':
          description: Resultado de predicción
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrediccionOutput'

  /reflexion/:
    post:
      operationId: generarReflexionJuridica
      summary: Análisis doctrinal basado en reflexión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextInput'
      responses:
        '200':
          description: Respuesta reflexiva
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultado:
                    type: string

  /vision/:
    post:
      operationId: generarVisionLegal
      summary: Análisis visual de situación legal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TextInput'
      responses:
        '200':
          description: Visión generada
          content:
            application/json:
              schema:
                type: object
                properties:
                  respuesta:
                    type: string

  /interpretar/:
    post:
      operationId: interpretarMensajeLegal
      summary: Interpreta una situación legal en lenguaje natural
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InterpretacionInput'
      responses:
        '200':
          description: Interpretación jurídica generada
          content:
            application/json:
              schema:
                type: object
                properties:
                  interpretacion:
                    type: string

  /text-search:
    get:
      operationId: buscarTextoNormativo
      summary: Búsqueda textual en la base de normativa
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                type: object
                properties:
                  resultados:
                    type: array
                    items:
                      type: string

components:
  schemas:
    TextInput:
      type: object
      required:
        - texto
      properties:
        texto:
          type: string
          example: "El empleador no entregó carta de despido."

    PrediccionInput:
      type: object
      required:
        - contexto
      properties:
        contexto:
          type: string
          example: "La empresa terminó el contrato sin previo aviso ni carta escrita."

    PrediccionOutput:
      type: object
      properties:
        riesgo:
          type: string
          example: "Alto"
        justificacion:
          type: string
          example: "Se detectaron términos críticos: 'despido sin aviso'."
        alertas:
          type: array
          items:
            type: string

    InterpretacionInput:
      type: object
      required:
        - mensaje
      properties:
        mensaje:
          type: string
          example: "Me despidieron por teléfono sin contrato. ¿Es legal?"