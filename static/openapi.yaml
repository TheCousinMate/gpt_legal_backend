openapi: 3.1.0
info:
  title: Forensic Legal Cognition API
  version: 4.1.0
  description: |
    API chilena de análisis jurídico automatizado con evaluación doctrinal 
    y verificación forense de alta precisión.
    
    Funcionalidades principales:
    - Análisis predictivo de riesgo legal
    - Evaluación doctrinal automatizada
    - Consulta a legislación chilena (BCN)
    - Análisis forense digital
    - Búsqueda textual en normativa
  contact:
    name: Kabir K. Hazbún Crovetto
    email: khazbun@gmail.com
    url: https://github.com/TheCousinMate/gpt_legal_backend
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT

servers:
  - url: https://gpt-legal-backend.onrender.com
    description: Servidor de producción en Render
  - url: http://localhost:8000
    description: Servidor de desarrollo local

paths:
  /:
    get:
      summary: Health Check
      description: Verifica el estado del API y retorna información básica
      operationId: health_check
      tags:
        - Sistema
      responses:
        '200':
          description: API funcionando correctamente
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "alive"
                  version:
                    type: string
                    example: "4.1.0"
                  title:
                    type: string
                  endpoints:
                    type: array
                    items:
                      type: string

  /status/json:
    get:
      summary: Estado detallado del sistema
      description: Información completa del estado operacional
      operationId: status_json
      tags:
        - Sistema
      responses:
        '200':
          description: Estado del sistema
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemStatus'

  /predict:
    post:
      summary: Predicción de Riesgo Legal
      description: |
        Analiza texto jurídico y predice niveles de riesgo legal usando
        patrones específicos del derecho chileno
      operationId: predict_risk
      tags:
        - Predicción Legal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                texto:
                  type: string
                  description: Texto legal a analizar
                  example: "Trabajador sin contrato formal recibe pagos irregulares"
                input:
                  type: string
                  description: Alias para texto
                contexto:
                  type: string
                  description: Contexto legal extenso
              oneOf:
                - required: [texto]
                - required: [input] 
                - required: [contexto]
      responses:
        '200':
          description: Análisis de riesgo completado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PredictionResponse'
        '400':
          description: Datos de entrada inválidos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /reflexion/:
    post:
      summary: Reflexión Jurídica Automatizada
      description: |
        Evaluación doctrinal profunda usando criterios jurídicos específicos
        como constitucionalidad, convencionalidad, etc.
      operationId: legal_reflection
      tags:
        - Análisis Doctrinal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflexionInput'
      responses:
        '200':
          description: Análisis doctrinal completado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualResponse'
        '400':
          description: Criterios o documento inválidos

  /api/prediccion/:
    post:
      summary: Predicción Bayesiana de Riesgo
      description: Análisis avanzado usando modelos probabilísticos
      operationId: bayesian_prediction
      tags:
        - Predicción Legal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrediccionInput'
      responses:
        '200':
          description: Predicción bayesiana completada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualResponse'

  /vision/:
    post:
      summary: Análisis Forense de Imágenes
      description: Análisis visual forense de documentos e imágenes legales
      operationId: forensic_vision
      tags:
        - Análisis Forense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisionInput'
      responses:
        '200':
          description: Análisis visual completado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualResponse'

  /legislacion/buscar:
    get:
      summary: Buscar normas legales
      description: Búsqueda de normas en la base de datos de la BCN
      operationId: search_legislation
      tags:
        - Legislación BCN
      parameters:
        - name: palabra
          in: query
          required: true
          schema:
            type: string
            minLength: 3
          description: Palabra clave para buscar en la legislación
          example: "contrato"
      responses:
        '200':
          description: Resultados de búsqueda
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'

  /legislacion/norma/{id_norma}:
    get:
      summary: Obtener norma por ID
      description: Recupera el detalle completo de una norma específica
      operationId: get_legislation_by_id
      tags:
        - Legislación BCN
      parameters:
        - name: id_norma
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          description: ID único de la norma en BCN
          example: 1234
      responses:
        '200':
          description: Detalle de la norma
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualResponse'

  /api/bcn/norma/{id_norma}:
    get:
      summary: Parser directo de norma BCN
      description: Extracción directa desde el sitio web de BCN
      operationId: parse_bcn_norm
      tags:
        - Legislación BCN
      parameters:
        - name: id_norma
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
          example: 5678
      responses:
        '200':
          description: Norma extraída desde BCN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BCNNormResponse'

  /forensics/search:
    get:
      summary: Búsqueda forense especializada
      description: Motor de búsqueda para análisis forense y transparencia
      operationId: forensic_search
      tags:
        - Análisis Forense
      parameters:
        - name: pregunta
          in: query
          required: true
          schema:
            type: string
            minLength: 5
          description: Consulta para análisis forense
          example: "beneficiario final empresa offshore"
      responses:
        '200':
          description: Resultados de análisis forense
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualResponse'

  /text-search:
    get:
      summary: Búsqueda textual en normativa
      description: Búsqueda de términos específicos en textos legales
      operationId: text_search
      tags:
        - Búsqueda Textual
      parameters:
        - name: palabra
          in: query
          required: true
          schema:
            type: string
            minLength: 3
          description: Término a buscar en textos legales
          example: "responsabilidad civil"
      responses:
        '200':
          description: Resultados de búsqueda textual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualResponse'

components:
  schemas:
    SystemStatus:
      type: object
      properties:
        status:
          type: string
          example: "operational"
        version:
          type: string
          example: "4.1.0"
        title:
          type: string
          example: "Forensic Legal Cognition 4.1"
        description:
          type: string
        total_endpoints:
          type: integer

    PredictionResponse:
      type: object
      properties:
        prediction:
          type: string
          description: Resultado del análisis predictivo
        confidence:
          type: string
          enum: [low, medium, high]
        source:
          type: string
          example: "forensic_legal_cognition"
        input_processed:
          type: string
          description: Preview del texto procesado

    DualResponse:
      type: object
      properties:
        json:
          type: string
          description: Respuesta en formato JSON estructurado
        markdown:
          type: string
          description: Respuesta en formato Markdown legible

    SearchResponse:
      allOf:
        - $ref: '#/components/schemas/DualResponse'
        - type: object
          properties:
            id:
              type: integer
              description: ID de la norma encontrada (si aplica)

    BCNNormResponse:
      type: object
      properties:
        norma:
          type: object
          properties:
            id:
              type: integer
            titulo:
              type: string
            fecha_publicacion:
              type: string
            contenido:
              type: string

    ReflexionInput:
      type: object
      required:
        - documento_analizado
        - criterios
      properties:
        documento_analizado:
          type: string
          description: Texto legal para análisis doctrinal
          minLength: 10
          example: "Artículo que establece procedimiento administrativo sin garantías del debido proceso"
        criterios:
          type: array
          items:
            type: string
          minItems: 1
          description: Criterios de evaluación jurídica
          example: ["constitucionalidad", "convencionalidad", "contradicción normativa"]

    PrediccionInput:
      type: object
      required:
        - contexto
      properties:
        contexto:
          type: string
          description: Contexto legal extenso para análisis bayesiano
          minLength: 50
          example: "Empresa realiza despidos masivos sin seguir protocolo legal establecido, afectando derechos fundamentales de trabajadores sindicalizados"

    VisionInput:
      type: object
      required:
        - image_id
      properties:
        image_id:
          type: string
          description: Identificador único de imagen para análisis forense
          minLength: 1
          example: "evidencia_fiscal_2025_001.jpg"

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Mensaje de error
        detail:
          type: string
          description: Detalle específico del error
        path:
          type: string
          description: Endpoint que generó el error

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API Key para autenticación (actualmente no requerida)

tags:
  - name: Sistema
    description: Endpoints de estado y salud del sistema
  - name: Predicción Legal
    description: Análisis predictivo y evaluación de riesgo legal
  - name: Análisis Doctrinal
    description: Evaluación jurídica profunda y reflexión doctrinal
  - name: Análisis Forense
    description: Herramientas de análisis forense digital
  - name: Legislación BCN
    description: Integración con Biblioteca del Congreso Nacional
  - name: Búsqueda Textual
    description: Motores de búsqueda especializados en textos legales