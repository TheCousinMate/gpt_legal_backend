openapi: 3.1.0
info:
  title: Forensic Legal Cognition API
  version: 4.1.0
  description: API chilena de análisis jurídico automatizado con evaluación doctrinal y verificación forense.
  contact:
    name: Kabir K. Hazbún Crovetto
    email: khazbun@gmail.com
servers:
  - url: https://gpt-legal-backend.onrender.com
    description: Producción Render
paths:
  /predict:
    post:
      operationId: predict_risk
      summary: Predicción jurídica
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrediccionInput'
      responses:
        '200':
          description: Resultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualResponse'
  /reflexion/:
    post:
      operationId: doctrinal_reflection
      summary: Reflexión doctrinal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReflexionInput'
      responses:
        '200':
          description: Reflexión generada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualResponse'
  /vision/:
    post:
      operationId: forensic_vision
      summary: Análisis visual forense
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisionInput'
      responses:
        '200':
          description: Resultado visual
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DualResponse'
  /interpretar/:
    post:
      operationId: interpretar_mensaje
      summary: Interpretación legal de lenguaje natural
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [mensaje]
              properties:
                mensaje:
                  type: string
      responses:
        '200':
          description: Interpretación
          content:
            application/json:
              schema:
                type: object
                properties:
                  interpretacion:
                    type: string
components:
  schemas:
    PrediccionInput:
      type: object
      required: [contexto]
      properties:
        contexto:
          type: string
          minLength: 50
          example: "El empleador terminó el contrato sin carta de aviso y sin pagar cotizaciones."
    ReflexionInput:
      type: object
      required: [documento_analizado, criterios]
      properties:
        documento_analizado:
          type: string
        criterios:
          type: array
          items:
            type: string
    VisionInput:
      type: object
      required: [image_id]
      properties:
        image_id:
          type: string
    DualResponse:
      type: object
      properties:
        respuesta:
          type: string
        clasificacion:
          type: string
        justificacion:
          type: string
        logs:
          type: object